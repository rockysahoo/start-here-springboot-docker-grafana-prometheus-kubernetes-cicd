name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-and-push:
    name: Build, test, and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run tests with CI test profile
        run: ./mvnw -B test -Dspring.profiles.active=test

      - name: Read artifactId from pom.xml
        id: artifact
        run: echo "artifact_id=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.artifactId)" >> "$GITHUB_OUTPUT"

      - name: Read version from pom.xml
        id: version
        run: echo "project_version=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)" >> "$GITHUB_OUTPUT"

      - name: Detect Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "can_push=true" >> "$GITHUB_OUTPUT"
            echo "username=$DOCKERHUB_USERNAME" >> "$GITHUB_OUTPUT"
          elif [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_PASSWORD" ]; then
            echo "can_push=true" >> "$GITHUB_OUTPUT"
            echo "username=$DOCKERHUB_USERNAME" >> "$GITHUB_OUTPUT"
          else
            echo "can_push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.can_push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ steps.dockerhub.outputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: steps.dockerhub.outputs.can_push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.dockerhub.outputs.username }}/${{ steps.artifact.outputs.artifact_id }}:${{ steps.version.outputs.project_version }}
            ${{ steps.dockerhub.outputs.username }}/${{ steps.artifact.outputs.artifact_id }}:latest

      - name: Build Docker image without pushing
        if: steps.dockerhub.outputs.can_push != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ steps.artifact.outputs.artifact_id }}:${{ steps.version.outputs.project_version }}

      - name: Explain skipped Docker Hub push
        if: steps.dockerhub.outputs.can_push != 'true'
        run: echo "Docker Hub credentials are not configured. The image was built locally, but the Docker Hub login and push steps were skipped. Configure DOCKERHUB_USERNAME with DOCKERHUB_TOKEN (preferred) or DOCKERHUB_PASSWORD to enable image publishing."

