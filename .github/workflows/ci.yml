name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-and-push:
    name: Build, test, and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests with CI test profile
        run: ./mvnw -B test -Dspring.profiles.active=test

      - name: Read artifactId from pom.xml
        id: artifact
        run: echo "artifact_id=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.artifactId)" >> "$GITHUB_OUTPUT"

      - name: Read version from pom.xml
        id: version
        run: echo "project_version=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.artifact.outputs.artifact_id }}:${{ steps.version.outputs.project_version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.artifact.outputs.artifact_id }}:latest

