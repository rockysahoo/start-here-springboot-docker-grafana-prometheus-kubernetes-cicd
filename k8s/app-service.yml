# ============================================================
# Spring Boot Application - Kubernetes Service
# ============================================================
# A Service gives the Deployment a stable network identity.
# Even when Pods are replaced, the Service IP/DNS stays constant.
# Type: ClusterIP  → accessible only inside the cluster (default).
# Type: NodePort   → also accessible via <NodeIP>:<NodePort>.
# Type: LoadBalancer → provisions a cloud load balancer (cloud only).
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: peer-study-service
  labels:
    app: peer-study-app
spec:
  type: NodePort          # Exposes the service on each Node's IP at a static port
  selector:
    app: peer-study-app   # Matches the pods created by app-deployment.yml
  ports:
    - name: http
      protocol: TCP
      port: 80            # Port exposed by the Service inside the cluster
      targetPort: 8081    # Port the container listens on
      nodePort: 30081     # External port on the Node (30000-32767 range)

