# ============================================================
# Grafana - Deployment
# ============================================================
# Grafana connects to Prometheus as a data source and shows
# dashboards for application metrics AND Kubernetes/pod metrics.
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            # Pre-configure Prometheus as the default data source
            - name: GF_DATASOURCES_DEFAULT_URL
              value: http://prometheus-service:9090
          volumeMounts:
            - mountPath: /var/lib/grafana
              name: grafana-storage
      volumes:
        - name: grafana-storage
          emptyDir: {}
---
# ============================================================
# Grafana - Service (NodePort so you can open the UI)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300   # Access Grafana at http://<NodeIP>:30300

