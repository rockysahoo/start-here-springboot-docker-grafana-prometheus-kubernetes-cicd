# ============================================================
# PostgreSQL - Kubernetes Deployment + Service
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate          # avoid two pods fighting over one data dir
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: testuser
            - name: POSTGRES_PASSWORD
              value: testpassword
            - name: POSTGRES_DB
              value: peer_study_db
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata   # subdir: survives lost+found on a real PVC
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "testuser", "-d", "peer_study_db"]
            initialDelaySeconds: 60
            periodSeconds: 30
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "testuser", "-d", "peer_study_db"]
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-storage
      volumes:
        - name: postgres-storage
          emptyDir: {}
---
# ============================================================
# PostgreSQL - ClusterIP Service (internal access only)
# The Spring Boot app connects via hostname: postgres-service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

