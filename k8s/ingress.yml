# ============================================================
# Nginx Ingress Controller - Route external traffic into the cluster
# ============================================================
# Prerequisites:
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/cloud/deploy.yaml
#   (minikube: minikube addons enable ingress)
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: peer-study-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: peer-study.local    # Add "127.0.0.1 peer-study.local" to /etc/hosts (or C:\Windows\System32\drivers\etc\hosts on Windows)
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: peer-study-service
                port:
                  number: 80

